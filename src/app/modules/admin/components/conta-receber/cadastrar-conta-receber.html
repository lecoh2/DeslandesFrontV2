<div class="container-fluid p-0">

    <h1 class="h3 mb-3">
        Cadastrar Conta a Receber
    </h1>

    <div class="card">

        <div class="card-header">
            <h5 class="card-title">
                Cadastro de Conta a Receber
            </h5>

            <h6 class="card-subtitle text-muted">
                Preencha os dados da conta a receber
            </h6>
        </div>

        <div class="card-body">

            <!-- INFO -->
            <div
                class="alert alert-primary border-0 shadow-sm d-flex align-items-center p-3 mb-4 rounded-3 alert-dismissible fade show"
                role="alert">

                <div class="me-3">
                    <i class="fas fa-circle-info fs-4 text-white bg-primary rounded-circle p-2"></i>
                </div>

                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-0">
                        Preencha os campos marcados com
                        <strong>*</strong>.
                    </h6>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
                </button>

            </div>

            <!-- SPINNER -->

            <app-spinner
                *ngIf="carregando"
                [show]="true"
                message="Salvando conta a receber...">
            </app-spinner>

            <!-- SUCESSO -->

            <app-alerts
                *ngIf="!carregando && mensagemSucesso.length"
                titulo="Sucesso!"
                [mensagens]="mensagemSucesso"
                tipo="success"
                icone="fas fa-check-circle">
            </app-alerts>

            <!-- ERRO -->

            <app-alerts
                *ngIf="!carregando && mensagemErro.length"
                titulo="Erro!"
                [mensagens]="mensagemErro"
                tipo="danger"
                icone="fas fa-times-circle">
            </app-alerts>

            <form
                [formGroup]="form"
                (ngSubmit)="onSubmit()">

                <!-- DESCRIÇÃO -->

                <div class="row mb-3">

                    <div class="col-md-12">

                        <label class="form-label">
                            Descrição *
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="descricao">

                    </div>

                    <div
                        class="text-danger mt-1"
                        *ngIf="
                        form.get('descricao')?.touched &&
                        form.get('descricao')?.errors">

                        <div *ngIf="form.get('descricao')?.errors?.['required']">
                            A descrição é obrigatória.
                        </div>

                    </div>

                </div>

                <!-- CLIENTE -->

                <div class="row mb-3">

                    <div class="col-md-12">

                        <app-autocomplete-pessoa-unica
                            label="Cliente *"
                            placeholder="Digite o cliente"
                            [resultados]="clientesFiltrados"
                            [selecionada]="clienteSelecionado"
                            (buscar)="buscarClientes($event)"
                            (selecionadaChange)="clienteSelecionado = $event">

                        </app-autocomplete-pessoa-unica>

                    </div>

                    <div
                        class="text-danger mt-1"
                        *ngIf="!clienteSelecionado && form.touched">

                        Escolha um cliente.

                    </div>

                </div>

                <!-- VALOR + VENCIMENTO -->

                <div class="row mb-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Valor *
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="valor"
                            (input)="onMoneyInput($event)">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Data de Vencimento *
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            formControlName="dataVencimento">

                    </div>

                </div>

                <!-- CONTRATO -->

                <div class="row mb-3">

                    <div class="col-md-12">

                        <label class="form-label">
                            Contrato
                        </label>

                        <select
                            class="form-select"
                            formControlName="contratoId">

                            <option value="">
                                Selecione...
                            </option>

                            <option
                                *ngFor="let contrato of contratos"
                                [value]="contrato.id">

                                {{ contrato.numero }}

                            </option>

                        </select>

                    </div>

                </div>

                <!-- CATEGORIA E CENTRO CUSTO -->

                <div class="row mb-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Categoria Financeira
                        </label>

                        <select
                            class="form-select"
                            formControlName="categoriaFinanceiraId">

                            <option value="">
                                Selecione...
                            </option>

                            <option
                                *ngFor="let categoria of categorias"
                                [value]="categoria.id">

                                {{ categoria.nome }}

                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Centro de Custo
                        </label>

                        <select
                            class="form-select"
                            formControlName="centroCustoId">

                            <option value="">
                                Selecione...
                            </option>

                            <option
                                *ngFor="let centro of centrosCusto"
                                [value]="centro.id">

                                {{ centro.nome }}

                            </option>

                        </select>

                    </div>

                </div>

                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="!podeEnviar || carregando">

                    <i class="fas fa-save me-2"></i>

                    Salvar Conta

                </button>

            </form>

        </div>

    </div>

</div>
