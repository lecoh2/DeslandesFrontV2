<div class="container-fluid p-0">

  <h1 class="h3 mb-3">
    Cadastrar Conta a Pagar
  </h1>

  <div class="card">

    <div class="card-header">
      <h5 class="card-title">
        Cadastro de Conta a Pagar
      </h5>

      <h6 class="card-subtitle text-muted">
        Preencha os dados da conta a pagar
      </h6>
    </div>

    <div class="card-body">

      <!-- ALERTA INFO -->
        <div
                class="alert alert-primary border-0 shadow-sm d-flex align-items-center p-3 mb-4 rounded-3 alert-dismissible fade show"
                role="alert">

                <div class="me-3">
                    <i class="fas fa-circle-info fs-4 text-white bg-primary rounded-circle p-2"></i>
                </div>

                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-0">
                        Preencha os campos marcados com
                        <strong>*</strong>.
                    </h6>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
                </button>

            </div>

      <!-- SPINNER -->
      <app-spinner
        *ngIf="carregando"
        [show]="true"
        message="Salvando conta a pagar...">
      </app-spinner>

      <!-- SUCESSO -->
      <app-alerts
        *ngIf="!carregando && mensagemSucesso.length"
        titulo="Sucesso!"
        [mensagens]="mensagemSucesso"
        tipo="success"
        icone="fas fa-check-circle">
      </app-alerts>

      <!-- ERRO -->
      <app-alerts
        *ngIf="!carregando && mensagemErro.length"
        titulo="Erro!"
        [mensagens]="mensagemErro"
        tipo="danger"
        icone="fas fa-times-circle">
      </app-alerts>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- DESCRIÇÃO -->
        <div class="mb-3">
          <label class="form-label">Descrição *</label>
          <input type="text" class="form-control" formControlName="descricao">

          <div class="text-danger mt-1"
            *ngIf="form.get('descricao')?.touched && form.get('descricao')?.errors">
            Descrição é obrigatória.
          </div>
        </div>

        <!-- FORNECEDOR -->
        <div class="mb-3">

          <label class="form-label">Fornecedor *</label>

          <app-autocomplete-pessoa-unica
            label="Fornecedor"
            placeholder="Digite o fornecedor"
            [resultados]="fornecedoresFiltrados"
            [selecionada]="fornecedorSelecionado"
            (buscar)="buscarFornecedores($event)"
            (selecionadaChange)="fornecedorSelecionado = $event">
          </app-autocomplete-pessoa-unica>

          <div class="text-danger mt-1"
            *ngIf="!fornecedorSelecionado && form.touched">
            Selecione um fornecedor.
          </div>

        </div>

        <!-- VALOR + VENCIMENTO -->
      <div class="row mb-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Valor *
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="valor"
                            (input)="onMoneyInput($event)">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Data de Vencimento *
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            formControlName="dataVencimento">

                    </div>

                </div>

        <!-- CATEGORIA + CENTRO CUSTO -->
        <div class="row mb-3">

          <div class="col-md-6">
            <label class="form-label">Categoria Financeira</label>
            <select class="form-select" formControlName="categoriaFinanceiraId">
              <option value="">Selecione...</option>

              <option *ngFor="let c of categorias" [value]="c.id">
                {{ c.nome }}
              </option>

            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Centro de Custo</label>
            <select class="form-select" formControlName="centroCustoId">
              <option value="">Selecione...</option>

              <option *ngFor="let c of centrosCusto" [value]="c.id">
                {{ c.nome }}
              </option>

            </select>
          </div>

        </div>

        <!-- BOTÃO -->
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="form.invalid || carregando">

          <i class="fas fa-save me-2"></i>
          Salvar Conta a Pagar

        </button>

      </form>

    </div>
  </div>
</div>
