<div class="position-relative">

    <label class="form-label fw-semibold">
        {{ label }}
    </label>

    <input
        type="text"
        class="form-control shadow-sm"
        [placeholder]="placeholder"
        [formControl]="control"
        (input)="onBuscar()"
        (focus)="mostrarSugestoes = true"
        (blur)="ocultarComDelay()" />

    <!-- Sugestões -->
    <ul
        *ngIf="mostrarSugestoes && resultados.length > 0"
        class="list-group position-absolute w-100 shadow-sm mt-1 zindex-dropdown">

        <li
            *ngFor="let p of resultados"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center hover-click"
            (mousedown)="selecionar(p)">

            <div class="d-flex flex-column flex-grow-1">

                <strong>
                    {{ p.nome }}
                </strong>

                <small>
                    Documento: {{ formatarDocumento(p.documento) }}
                </small>

            </div>

            <i class="fas fa-plus text-primary"></i>

        </li>

    </ul>

    <!-- Cliente selecionado -->
    <div *ngIf="selecionada" class="mt-3">

        <h6 class="text-muted mb-2">
            Cliente Selecionado
        </h6>

        <div
            class="d-flex justify-content-between align-items-center py-2 px-2 border-bottom">

            <div class="d-flex flex-column flex-grow-1">

                <strong>
                    {{ selecionada?.nome }}
                </strong>

                <small class="text-muted">

                    Documento:
                    {{ formatarDocumento(selecionada?.documento) }}

                </small>

            </div>

            <button
                type="button"
                class="border-0 bg-transparent p-0"
                (click)="remover()">

                <i class="fas fa-fw fa-trash-alt text-muted"></i>

            </button>

        </div>

    </div>

</div>
