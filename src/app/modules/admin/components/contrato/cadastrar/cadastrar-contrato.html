<div class="container-fluid p-0">

    <h1 class="h3 mb-3">Cadastrar Contrato</h1>

    <div class="card">

        <div class="card-header">
            <h5 class="card-title">Cadastro de Contrato</h5>
            <h6 class="card-subtitle text-muted">
                Preencha os dados do contrato
            </h6>
        </div>

        <div class="card-body">

            <!-- SPINNER -->
            <app-spinner
                *ngIf="carregando"
                [show]="true"
                message="Salvando contrato...">
            </app-spinner>

            <!-- SUCESSO -->
            <app-alerts
                *ngIf="!carregando && mensagemSucesso.length"
                titulo="Sucesso!"
                [mensagens]="mensagemSucesso"
                tipo="success">
            </app-alerts>

            <!-- ERRO -->
            <app-alerts
                *ngIf="!carregando && mensagemErro.length"
                titulo="Erro!"
                [mensagens]="mensagemErro"
                tipo="danger">
            </app-alerts>

            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <!-- DADOS DO CONTRATO -->
                <h5 class="mb-3">Dados do Contrato</h5>

                <div class="row mb-3">

                    <div class="col-md-4">
                        <label class="form-label">
                            Número do Contrato *
                        </label>

                        <input
                            class="form-control"
                            formControlName="numero">
                    </div>

                    <div class="col-md-8">

                    <div class="col-md-8">

    <label class="form-label">Cliente *</label>

    <input
        type="text"
        class="form-control"
        placeholder="Digite o nome do cliente"
        #clienteInput
        (keyup)="buscarPessoa(clienteInput.value)">

    <div
        *ngIf="pessoasFiltradas.length > 0"
        class="list-group position-absolute w-50 shadow">

        <button
            type="button"
            class="list-group-item list-group-item-action"
            *ngFor="let pessoa of pessoasFiltradas"
            (click)="selecionarPessoa(pessoa)">

            {{ pessoa.nome }}

        </button>

    </div>

    <div
        *ngIf="pessoaSelecionada"
        class="alert alert-info mt-2 d-flex justify-content-between align-items-center">

        <span>
            {{ pessoaSelecionada.nome }}
        </span>

        <button
            type="button"
            class="btn btn-sm btn-danger"
            (click)="removerPessoa()">

            Remover

        </button>

    </div>

</div>

                    </div>

                </div>

                <div class="row mb-3">

                    <div class="col-md-4">
                        <label class="form-label">
                            Valor do Contrato *
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="valorContrato">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Data Inicial *
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            formControlName="dataInicio">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Data Final
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            formControlName="dataFim">
                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="carregando">

                    <i class="fas fa-save"></i>
                    Salvar Contrato

                </button>

            </form>

        </div>

    </div>

</div>
