<div class="container-fluid p-0">

    <h1 class="h3 mb-3">Editar Centro de Custo</h1>

    <div class="card">

        <div class="card-header">
            <h5 class="card-title">Edição de Centro de Custo</h5>
            <h6 class="card-subtitle text-muted">
                Atualize os dados do centro de custo
            </h6>
        </div>

        <div class="card-body">

            <!-- AVISO -->
            <div class="alert alert-primary border-0 shadow-sm d-flex align-items-center p-3 mb-4 rounded-3 alert-dismissible fade show"
                role="alert">

                <div class="me-3">
                    <i class="fas fa-circle-info fs-4 text-white bg-primary rounded-circle p-2"></i>
                </div>

                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-0">
                        Preencha os campos marcados com <strong>*</strong>.
                    </h6>
                </div>

                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
                </button>

            </div>

            <!-- SPINNER -->
            <app-spinner *ngIf="carregando" [show]="true" message="Carregando...">
            </app-spinner>

            <!-- ALERTAS -->
            <app-alerts *ngIf="!carregando && mensagemSucesso.length" titulo="Sucesso!" [mensagens]="mensagemSucesso"
                tipo="success" icone="fas fa-check-circle">
            </app-alerts>

            <app-alerts *ngIf="!carregando && mensagemErro.length" titulo="Erro!" [mensagens]="mensagemErro"
                tipo="danger" icone="fas fa-times-circle">
            </app-alerts>

            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <div class="row mb-3">

                    <div class="col-md-8">

                        <label class="form-label">
                            Nome *
                        </label>

                        <input type="text" class="form-control" formControlName="nome">

                        <div class="text-danger mt-1" *ngIf="form.get('nome')?.touched &&
                               form.get('nome')?.errors">

                            <div *ngIf="form.get('nome')?.errors?.['required']">
                                O nome do centro de custo é obrigatório.
                            </div>

                        </div>

                    </div>
    <div class="col-md-4">
                    <label class="form-label">Status</label>

                    <select formControlName="ativo" class="form-select">

                        <option [ngValue]="true">
                            Ativo
                        </option>

                        <option [ngValue]="false">
                            Inativo
                        </option>

                    </select>
                </div>
                </div>
            

                <div class="row mb-4">

                    <div class="col-md-12">

                        <label class="form-label">
                            Descrição
                        </label>

                        <textarea rows="4" class="form-control" formControlName="descricao">
                    </textarea>

                    </div>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary" [disabled]="!podeEnviar || carregando">

                        <i class="fas fa-save me-2"></i>
                        Salvar Alterações

                    </button>

                    <button type="button" class="btn btn-secondary" (click)="irParaLista()">

                        <i class="fas fa-arrow-left me-2"></i>
                        Voltar

                    </button>

                </div>

            </form>

        </div>

    </div>


</div>
